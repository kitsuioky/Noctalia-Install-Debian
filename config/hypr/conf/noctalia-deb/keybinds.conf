# keybinds.conf — atalhos de teclado (gerenciado pelo Noctalia-install-deb)
# Os atalhos do mouse estão em mouse.conf.
$mod = SUPER

# Programas
bind = $mod, Return, exec, alacritty
bind = $mod, E, exec, nautilus
bind = $mod, B, exec, brave-origin
bind = $mod, D, exec, @SHELL_BIN@ msg panel-toggle launcher
bind = $mod, Space, exec, @SHELL_BIN@ msg panel-toggle launcher
bind = $mod, S, exec, @SHELL_BIN@ msg panel-toggle control-center
bind = $mod, L, exec, sh -c '@SHELL_BIN@ msg session lock || @SHELL_BIN@ msg screen-lock'
bind = $mod, comma, exec, @SHELL_BIN@ msg settings-toggle
bind = $mod, X, exec, @SHELL_BIN@ msg panel-toggle session

# Janelas
bind = $mod, Q, killactive
bind = $mod, V, togglefloating
bind = $mod, F, fullscreen
bind = $mod, P, pseudo
bind = $mod, J, togglesplit
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d
bind = ALT, Tab, cyclenext
bind = ALT, Tab, bringactivetotop

# Sair da sessão
bind = $mod SHIFT, E, exit

# Capturas de tela (pasta ~/Imagens ou ~/Pictures precisa existir; se não, cai no clipboard)
bind = , Print, exec, @SHELL_BIN@ msg screenshot-region
bind = SHIFT, Print, exec, sh -c 'grim - | wl-copy'
bind = $mod SHIFT, S, exec, sh -c 'grim -g "$(slurp)" - | swappy -f -'

# Volume, brilho e mídia (teclas do teclado/notebook)
bindel = , XF86AudioRaiseVolume, exec, @SHELL_BIN@ msg volume-up
bindel = , XF86AudioLowerVolume, exec, @SHELL_BIN@ msg volume-down
bindl  = , XF86AudioMute, exec, @SHELL_BIN@ msg volume-mute
bindel = , XF86MonBrightnessUp, exec, @SHELL_BIN@ msg brightness-up
bindel = , XF86MonBrightnessDown, exec, @SHELL_BIN@ msg brightness-down

# Áreas de trabalho
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
