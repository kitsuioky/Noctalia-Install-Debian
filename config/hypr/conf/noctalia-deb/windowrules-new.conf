# windowrules.conf — sintaxe nova (Hyprland 0.53+). Gerenciado pelo Noctalia-install-deb.
# Janelas pequenas/utilitárias abrem flutuando e centralizadas, para você mover e redimensionar com o mouse.
windowrule = float on, match:class ^(pavucontrol|org\.pulseaudio\.pavucontrol)$
windowrule = float on, match:class ^(nm-connection-editor|blueman-manager|\.blueman-manager-wrapped)$
windowrule = float on, match:class ^(org\.gnome\.Calculator|org\.gnome\.SystemMonitor|org\.gnome\.DiskUtility)$
windowrule = float on, match:class ^(xdg-desktop-portal-gtk|org\.freedesktop\.impl\.portal\.desktop\.gtk)$
windowrule = float on, match:title ^(Abrir arquivo|Salvar como|Open File|Save As|Open Folder|Select Folder)$
windowrule = center on, match:class ^(pavucontrol|org\.pulseaudio\.pavucontrol|nm-connection-editor|blueman-manager|org\.gnome\.Calculator|xdg-desktop-portal-gtk)$
windowrule = float on, match:class ^(@SHELL_APPID_RE@)$
