# windowrules.conf — sintaxe antiga (Hyprland < 0.53). Gerenciado pelo Noctalia-install-deb.
# Janelas pequenas/utilitárias abrem flutuando e centralizadas, para você mover e redimensionar com o mouse.
windowrulev2 = float, class:^(pavucontrol|org\.pulseaudio\.pavucontrol)$
windowrulev2 = float, class:^(nm-connection-editor|blueman-manager|\.blueman-manager-wrapped)$
windowrulev2 = float, class:^(org\.gnome\.Calculator|org\.gnome\.SystemMonitor|org\.gnome\.DiskUtility)$
windowrulev2 = float, class:^(xdg-desktop-portal-gtk|org\.freedesktop\.impl\.portal\.desktop\.gtk)$
windowrulev2 = float, title:^(Abrir arquivo|Salvar como|Open File|Save As|Open Folder|Select Folder)$
windowrulev2 = center, class:^(pavucontrol|org\.pulseaudio\.pavucontrol|nm-connection-editor|blueman-manager|org\.gnome\.Calculator|xdg-desktop-portal-gtk)$
windowrulev2 = float, class:^(@SHELL_APPID_RE@)$
