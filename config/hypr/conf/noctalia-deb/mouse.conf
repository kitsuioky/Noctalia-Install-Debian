# mouse.conf — suporte a mouse nas janelas (gerenciado pelo Noctalia-install-deb)
#
#   Super + arrastar com botão ESQUERDO  = mover a janela (ela vira flutuante se precisar)
#   Super + arrastar com botão DIREITO   = redimensionar a janela
#   Arrastar a BORDA da janela           = redimensionar
#   Clicar na janela                     = dar foco
#   Super + roda do mouse                = trocar de área de trabalho

input {
    # o foco acompanha o mouse; clicar em uma janela também dá foco
    follow_mouse = 1
    float_switch_override_focus = 2
    touchpad {
        natural_scroll = true
        tap-to-click = true
        clickfinger_behavior = true
        disable_while_typing = true
    }
}

general {
    resize_on_border = true
    extend_border_grab_area = 15
    hover_icon_on_border = true
}

$mouseMod = SUPER

bindm = $mouseMod, mouse:272, movewindow
bindm = $mouseMod, mouse:273, resizewindow

bind = $mouseMod, mouse_down, workspace, e+1
bind = $mouseMod, mouse_up, workspace, e-1
